schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Acceptance oracles (adopted 2026-10-23, from the revision-control pilot).
# See docs/agent-collaboration.md, "Write acceptance as oracles", and
# docs/oracle-hazards.md for the hazard catalog.
rules:
  design:
    - Add an "Acceptance oracles" subsection whenever the change has decision
      logic, a state machine, parsing or security checks, or concurrency;
      small, well-specified changes need none.
    - Write decision tables of observable results only — inputs × outputs,
      `*` for a don't-care, and unreachable combinations listed with their
      reasons — and give every row an oracle id.
    - State one property per invariant, giving the property, the generator,
      the seams, a fixed seed and a case count, with no new dependency.
    - For a state machine with recovery, add a completeness claim (every
      combination of the axes matches exactly one row or one unreachable
      claim) and model-based tests that run the table as the reference model,
      under seeded command sequences with replays, supersessions, and a crash
      at each transaction boundary.
    - Consult docs/oracle-hazards.md before finalizing the tables.
    - Give every design the required Implementation contract section, with the
      heading `## Implementation contract`, then the parts `### Acceptance`
      (A1, A2, ...), `### Invariants` (I1, ...), `### Scope` (one
      repository-relative glob per bullet, at least one), `### Verification`
      (V1, ...), and `### Excluded` (X1, ...), in that order; Acceptance and
      Verification are never empty. Write clauses a reviewer can judge pass
      or fail, as docs/agent-collaboration.md describes under "Write the
      implementation contract"; plan validation refuses a change without a
      parseable section.
  tasks:
    - Make every Verify bullet cite its oracle ids and name the mutant each
      must kill.
    - Have the tables committed verbatim as table-driven tests, together with
      the code they cover.
    - Make the result map each oracle id to a test title and a killed mutant.
