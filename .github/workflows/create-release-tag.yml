name: Create Release Tag

on:
  pull_request_target:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The merge commit this PR produced on master, not master's current head:
      # a PR merged moments later must not steal this PR's number.
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # The version check below shells out to `node`; unlike the hosted
      # images, the runner's does not ship one preinstalled.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # package.json carries the plain MAJOR.MINOR.PATCH base, bumped by hand
      # through `bun run release:*`. The merged PR number is appended as a
      # semver prerelease identifier, so every merge cuts its own release
      # without a version-bump commit: base 1.0.0 + PR 321 -> v1.0.0-321.
      # Numeric prerelease identifiers compare numerically, so the tags sort in
      # merge order (1.0.0-321 < 1.0.0-324 < 1.0.1-330).
      - name: Resolve version and tag
        id: check_version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BASE=$(node -p "require('./package.json').version")
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$BASE' is not a plain MAJOR.MINOR.PATCH base; CI owns the -<PR> suffix and refuses to append to a version that already carries one"
            exit 1
          fi

          VERSION="$BASE-$PR_NUMBER"
          TAG_NAME="v$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

          # A given PR number can only be merged once, so this fires on a
          # workflow re-run — the tag is already there and still points at the
          # same commit.
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME already exists, skipping"
          else
            echo "should_tag=true" >> $GITHUB_OUTPUT
            echo "Will create tag $TAG_NAME"
          fi

      - name: Create and push tag
        if: steps.check_version.outputs.should_tag == 'true'
        run: |
          TAG_NAME="${{ steps.check_version.outputs.tag }}"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created and pushed tag: $TAG_NAME"
          echo "This will trigger the Release workflow to build and publish binaries"
