name: Nightly real-tmux trial

# TRIAL ONLY (check-time-optimization task 2.1-2.2): a dispatch needs the
# workflow on master, so this runs it from the feature branch on push, once
# as scheduled and once with the forced failure. Removed before merge.
on:
  push:
    branches: [feat/real-tmux-selection]

permissions:
  contents: read
  issues: write

jobs:
  scheduled:
    uses: ./.github/workflows/nightly-real-tmux.yml
    with:
      force_failure: false
  forced-failure:
    needs: scheduled
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/nightly-real-tmux.yml
    with:
      force_failure: true
