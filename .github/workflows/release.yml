name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Every target is a `bun build --compile` cross-compile, so all four
    # platforms build on one Linux runner: the frontend is built once and the
    # loop below only swaps the compile target.
    runs-on: local-k8s
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build and package all platform binaries
        run: |
          set -euo pipefail
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            artifact="agentboard-${target#bun-}"
            echo "Building $target -> $artifact"
            bun build src/server/index.ts src/server/sessionRefreshWorker.ts src/server/logMatchWorker.ts \
              --compile --target "$target" --outfile "$artifact"
            mkdir -p "package/$artifact/bin" "package/$artifact/dist"
            mv "$artifact" "package/$artifact/bin/agentboard"
            cp -r dist/client "package/$artifact/dist/client"
            chmod +x "package/$artifact/bin/agentboard"
          done

      # Magic bytes via od rather than `file`: the runner image may not ship
      # file(1). Mach-O 64-bit is 0xfeedfacf little-endian (cf fa ed fe); a
      # universal binary would start with the fat-header cafebabe.
      - name: Sanity-check binary formats and sizes
        run: |
          set -euo pipefail
          for artifact in agentboard-darwin-arm64 agentboard-darwin-x64 agentboard-linux-x64 agentboard-linux-arm64; do
            bin="package/$artifact/bin/agentboard"
            magic="$(od -An -tx1 -N4 "$bin" | tr -d ' \n')"
            case "$magic" in
              cffaedfe|cafebabe) echo "$artifact: Mach-O ok" ;;
              7f454c46) echo "$artifact: ELF ok" ;;
              *)
                echo "::error::$artifact: unexpected magic bytes '$magic', not a Mach-O/ELF binary"
                exit 1
                ;;
            esac
            size="$(stat -c%s "$bin")"
            if [ "$size" -lt $((20 * 1024 * 1024)) ]; then
              echo "::error::$artifact is only $size bytes; a compiled binary embeds the Bun runtime and is far larger — the build is truncated or corrupt"
              exit 1
            fi
            echo "$artifact: $size bytes"
          done

      # The linux binary for this runner's architecture runs here: boot it and
      # wait for the server's own startup_state log line, then kill it. The
      # other architecture's binary and the darwin binaries cannot execute on
      # this runner — the magic-byte and size checks above are their
      # verification, plus a real-Mac check of the first canary release.
      #
      # The copy to $RUNNER_TEMP and the cd matter: run from the workspace
      # (which has node_modules after bun install), Bun resolves the embedded
      # logger's worker_threads file against the sibling node_modules and the
      # binary crashes — users never run it next to a node_modules, and the
      # smoke test must not either.
      - name: Boot-test the native linux binary
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native="agentboard-linux-x64" ;;
            aarch64|arm64) native="agentboard-linux-arm64" ;;
            *)
              echo "::error::Unknown runner architecture $(uname -m); cannot pick a binary to boot-test"
              exit 1
              ;;
          esac
          cp "package/$native/bin/agentboard" "$RUNNER_TEMP/agentboard"
          cd "$RUNNER_TEMP"
          log="$RUNNER_TEMP/$native-boot.log"
          # A random port: the smoke instance must never contend with
          # whatever the runner environment itself may be serving.
          PORT=$((41000 + RANDOM % 20000)) ./agentboard >"$log" 2>&1 &
          pid=$!
          booted=""
          for _ in $(seq 1 30); do
            # Read the log before the liveness check: a binary that logs
            # startup_state and then dies must still be reported as having
            # reached startup, not as "did not reach startup".
            if grep -q "startup_state" "$log" 2>/dev/null; then
              booted=yes
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ -z "$booted" ]; then
            echo "::error::$native did not reach startup within 15s"
            cat "$log"
            exit 1
          fi
          echo "$native: booted"

      - name: Upload agentboard-darwin-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentboard-darwin-arm64
          path: package/agentboard-darwin-arm64/

      - name: Upload agentboard-darwin-x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentboard-darwin-x64
          path: package/agentboard-darwin-x64/

      - name: Upload agentboard-linux-x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentboard-linux-x64
          path: package/agentboard-linux-x64/

      - name: Upload agentboard-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentboard-linux-arm64
          path: package/agentboard-linux-arm64/

  release:
    needs: build
    runs-on: local-k8s
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # npm >= 11.5.1 (bundled with node 24) is required for OIDC trusted
          # publishing; publishes authenticate via the job's id-token, no
          # NPM_TOKEN secret involved.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish platform packages
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "Publishing @gbasin/agentboard-$platform@$VERSION"
            cd npm/agentboard-$platform
            mkdir -p bin dist
            cp ../../artifacts/agentboard-$platform/bin/agentboard ./bin/agentboard
            cp -r ../../artifacts/agentboard-$platform/dist/client ./dist/client
            chmod +x ./bin/agentboard
            npm version $VERSION --no-git-tag-version --allow-same-version
            npm publish --provenance --access public
            cd ../..
          done

      - name: Update main package optionalDependencies
        run: node scripts/update-optional-deps.js ${{ steps.version.outputs.version }}

      - name: Publish main package
        run: npm publish --provenance --access public

      - name: Collect binaries and tarballs for GitHub Release
        run: |
          mkdir -p release-binaries
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cp artifacts/agentboard-$platform/bin/agentboard release-binaries/agentboard-$platform
            tar -czf release-binaries/agentboard-$platform.tar.gz \
              -C artifacts/agentboard-$platform \
              bin/agentboard dist/client
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: release-binaries/agentboard-*
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Compute SHA256 for each platform tarball
          declare -A SHAS
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            SHAS[$platform]=$(shasum -a 256 release-binaries/agentboard-$platform.tar.gz | cut -d' ' -f1)
          done

          # Clone the tap repo
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gbasin/homebrew-tap.git tap
          cd tap

          # Generate the formula
          cat > Formula/agentboard.rb << 'FORMULA'
          # typed: strict
          # frozen_string_literal: true

          # Formula for agentboard - Web GUI for tmux optimized for AI agent TUIs
          class Agentboard < Formula
            desc "Web GUI for tmux optimized for AI agent TUIs"
            homepage "https://github.com/gbasin/agentboard"
          FORMULA

          # Append version and platform blocks with real SHA256 values
          cat >> Formula/agentboard.rb << EOF
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/gbasin/agentboard/releases/download/v${VERSION}/agentboard-darwin-arm64.tar.gz"
                sha256 "${SHAS[darwin-arm64]}"
              end
              on_intel do
                url "https://github.com/gbasin/agentboard/releases/download/v${VERSION}/agentboard-darwin-x64.tar.gz"
                sha256 "${SHAS[darwin-x64]}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/gbasin/agentboard/releases/download/v${VERSION}/agentboard-linux-arm64.tar.gz"
                sha256 "${SHAS[linux-arm64]}"
              end
              on_intel do
                url "https://github.com/gbasin/agentboard/releases/download/v${VERSION}/agentboard-linux-x64.tar.gz"
                sha256 "${SHAS[linux-x64]}"
              end
            end

            depends_on "tmux"

            def install
              libexec.install "bin/agentboard" => "agentboard"
              chmod 0755, libexec/"agentboard"
              (libexec/"dist").install "dist/client"

              (bin/"agentboard").write <<~SHELL
                #!/bin/bash
                export AGENTBOARD_STATIC_DIR="#{libexec}/dist/client"
                exec "#{libexec}/agentboard" "\\\$@"
              SHELL
              (bin/"agentboard").chmod 0755
            end

            test do
              assert_predicate bin/"agentboard", :executable?
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentboard.rb
          git commit -m "agentboard ${VERSION}"
          git push
