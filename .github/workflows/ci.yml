name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# The local runner pool is small: a second push to the same branch supersedes
# the first run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: local-k8s-public
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency risk scan
        run: bun run deps:risk:ci

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test:ci

      - name: Test (coverage)
        run: bun run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Build
        run: bun run build

  e2e:
    runs-on: local-k8s-public
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure tmux is available
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux $(tmux -V) already present"
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y tmux
            if ! command -v tmux >/dev/null 2>&1; then
              echo "::error::tmux install reported success but tmux is not on PATH"
              exit 1
            fi
            echo "installed $(tmux -V)"
          else
            echo "::error::tmux is not installed on this runner and cannot be installed (no passwordless sudo). Add tmux to the runner image."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Verify Chromium launches, installing system deps only if needed
        run: |
          if bun scripts/playwright-launch-check.ts; then
            exit 0
          fi
          echo "Chromium failed to launch; installing its system dependencies"
          bunx playwright install-deps chromium
          if ! bun scripts/playwright-launch-check.ts; then
            echo "::error::Chromium cannot launch: system dependencies are missing and could not be installed (no passwordless sudo?). Add Playwright's chromium deps to the runner image."
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Run e2e tests
        run: bunx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
